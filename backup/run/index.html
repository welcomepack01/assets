
<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K-Pop Demon Hunter Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
      :root {
        /* K-Pop Theme Colors */
        --bg-gradient: linear-gradient(180deg, #110022 0%, #000000 100%);
        --speed-line-color-1: rgba(255, 20, 147, 0.4); 
        --speed-line-color-2: rgba(0, 255, 255, 0.2);
      }
      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg-gradient);
        font-family: 'Archivo Black', sans-serif;
        font-weight: 400; 
        font-style: normal; 
      }
      h1, h2, .font-title {
        font-family: 'Archivo Black', sans-serif;
        letter-spacing: -1px;
      }
      .pixelated {
        image-rendering: pixelated;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fade-in {
        animation: fadeIn 1s ease-out forwards;
      }
      @keyframes floatUp {
        0% { transform: translate(-50%, 0) scale(1); opacity: 1; }
        50% { transform: translate(-50%, -40px) scale(1.2); opacity: 1; }
        100% { transform: translate(-50%, -80px) scale(1); opacity: 0; }
      }
      .animate-float-up {
        animation: floatUp 0.8s ease-out forwards;
      }
      @keyframes popIn {
        0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
        80% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: popIn 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes scaleUp {
        0% { transform: scale(0.5); opacity: 0; }
        60% { transform: scale(1.2); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-scale-up {
        animation: scaleUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      @keyframes scaleUpSmooth {
        0% { transform: scale(0.5); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-scale-up-smooth {
        animation: scaleUpSmooth 0.3s ease-out forwards;
      }
      @keyframes zoomFast {
        0% { transform: scale(0.3); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-zoom-fast {
        animation: zoomFast 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      
      /* SPEED LINES */
      .speed-lines-container {
        position: absolute;
        inset: 0;
        pointer-events: none;
        z-index: 10; 
        opacity: 0;
        transition: opacity 0.3s ease-out;
        overflow: hidden; 
        -webkit-mask-image: radial-gradient(ellipse at center, transparent 40%, black 90%);
        mask-image: radial-gradient(ellipse at center, transparent 40%, black 90%);
      }
      .speed-lines-container.active {
        opacity: 1;
      }
      .speed-lines {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 150vmax; 
        height: 150vmax;
        transform: translate(-50%, -50%);
        will-change: transform;
      }
      .speed-lines.cw {
        background: repeating-conic-gradient(
          from 0deg at 50% 50%,
          transparent 0deg 4deg,   
          var(--speed-line-color-1) 4deg 4.6deg, 
          transparent 4.6deg 8deg,
          rgba(255, 255, 255, 0.1) 8deg 8.3deg, 
          transparent 8.3deg 12deg
        );
        animation: speedShakeCW 0.8s steps(1) infinite; 
        opacity: 0.9; 
      }
      .speed-lines.ccw {
        background: repeating-conic-gradient(
          from 180deg at 50% 50%,
          transparent 0deg 5deg,
          var(--speed-line-color-2) 5deg 5.4deg, 
          transparent 5.4deg 10deg,
          rgba(255, 255, 255, 0.1) 10deg 10.3deg, 
          transparent 10.3deg 15deg
        );
        animation: speedShakeCCW 0.8s steps(1) infinite;
        opacity: 0.8; 
      }
      @keyframes speedShakeCW {
        0%   { transform: translate(-50%, -50%) rotate(0deg); }
        25%  { transform: translate(calc(-50% + 5px), calc(-50% - 3px)) rotate(5deg); }
        50%  { transform: translate(calc(-50% - 5px), calc(-50% + 3px)) rotate(10deg); }
        75%  { transform: translate(calc(-50% + 3px), calc(-50% + 5px)) rotate(5deg); }
        100% { transform: translate(-50%, -50%) rotate(0deg); }
      }
      @keyframes speedShakeCCW {
        0%   { transform: translate(-50%, -50%) rotate(0deg) scale(1.1); }
        25%  { transform: translate(calc(-50% - 5px), -50%) rotate(-5deg) scale(1.1); }
        50%  { transform: translate(-50%, calc(-50% + 5px)) rotate(-10deg) scale(1.1); }
        75%  { transform: translate(calc(-50% + 5px), calc(-50% - 5px)) rotate(-5deg) scale(1.1); }
        100% { transform: translate(-50%, -50%) rotate(0deg) scale(1.1); }
      }
    </style>
